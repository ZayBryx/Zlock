<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zlock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #000000; /* Pure Black background */
        --surface: rgba(255, 255, 255, 0.035);
        --surface-h: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.06);
        --border-glow: rgba(255, 107, 0, 0.35); /* Orange border glow */
        --text: #f5f5f7;
        --muted: rgba(255, 255, 255, 0.45);
        --blue: #ff6b00;    /* Primary Orange */
        --cyan: #ff9f43;    /* Light Orange */
        --violet: #e65c00;  /* Dark Orange */
        --pink: #ff3300;    /* Red-Orange */
        --amber: #ffb03a;   /* Amber */
        --green: #ff8800;   /* Bright Orange Accent */
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Outfit", sans-serif;
        background: var(--bg);
        color: var(--text);
        user-select: none;
        /* Floating widget look once OS frame is removed */
        border-radius: 12px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.07);
      }

      .app {
        border-radius: 12px;
        overflow: hidden;
      }

      /* ── Ambient glow background ── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 70% 55% at 15% 5%,
            rgba(255, 107, 0, 0.08) 0%,
            transparent 65%
          ),
          radial-gradient(
            ellipse 55% 45% at 85% 90%,
            rgba(255, 168, 0, 0.06) 0%,
            transparent 65%
          ),
          radial-gradient(
            ellipse 45% 40% at 55% 40%,
            rgba(255, 80, 0, 0.04) 0%,
            transparent 55%
          );
        animation: glow 18s ease-in-out infinite alternate;
      }
      @keyframes glow {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0.65;
        }
      }

      /* ── Root layout ── */
      .app {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* ════════════════════════════════════════
       CUSTOM TITLEBAR
    ════════════════════════════════════════ */
      .titlebar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 14px;
        height: 44px;
        -webkit-app-region: drag;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(10, 12, 20, 0.35);
        backdrop-filter: blur(24px) saturate(180%);
        gap: 10px;
      }

      /* Traffic-light style dots */
      .win-controls {
        display: flex;
        gap: 7px;
        align-items: center;
        -webkit-app-region: no-drag;
        flex-shrink: 0;
      }
      .win-btn {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        transition:
          opacity 0.15s,
          transform 0.15s;
        position: relative;
        overflow: hidden;
      }
      .win-btn:hover {
        opacity: 0.8;
        transform: scale(1.12);
      }
      .win-btn.close {
        background: linear-gradient(135deg, #ff5f57, #e03e36);
        box-shadow: 0 0 6px rgba(255, 95, 87, 0.5);
      }
      .win-btn.min {
        background: linear-gradient(135deg, #febc2e, #d49b1a);
        box-shadow: 0 0 6px rgba(254, 188, 46, 0.4);
      }
      .win-btn.max {
        background: linear-gradient(135deg, #28c840, #1aa030);
        box-shadow: 0 0 6px rgba(40, 200, 64, 0.4);
      }

      /* Title */
      .titlebar-title {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        pointer-events: none;
      }
      .titlebar-icon {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-img {
        display: block;
        width: 14px;
        height: 15px;
      }
      .titlebar-name {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: rgba(200, 215, 255, 0.75);
      }
      .titlebar-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--blue);
        opacity: 0.5;
      }
      .titlebar-sub {
        font-size: 11px;
        color: var(--muted);
        font-weight: 400;
      }



      /* ════════════════════════════════════════
       ZONES SECTION
    ════════════════════════════════════════ */
      .zones-wrap {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 12px 14px 14px;
        gap: 10px;
        overflow-y: auto;
        scrollbar-width: none; /* hide scrollbar but still scrollable */
      }
      .zones-wrap::-webkit-scrollbar {
        display: none;
      }

      /* ── Clock card ── */
      .clock-card {
        flex-shrink: 0;
        position: relative;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px) saturate(120%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05),
                    0 4px 20px rgba(0, 0, 0, 0.15);
        border-radius: 14px;
        padding: 12px 14px 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition:
          background 0.2s,
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s;
        overflow: hidden;
      }
      .clock-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1.5px;
        border-radius: 14px 14px 0 0;
        background: linear-gradient(
          90deg,
          var(--blue),
          var(--cyan)
        );
        opacity: 0.7;
      }
      .clock-card:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(99, 179, 237, 0.35);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1),
                    0 6px 24px rgba(99, 179, 237, 0.12);
        transform: translateX(2px);
      }
      .clock-card:hover .remove-btn {
        opacity: 1;
      }

      /* Flag col */
      .card-flag {
        font-size: 26px;
        flex-shrink: 0;
        line-height: 1;
      }

      /* Info col */
      .card-info {
        flex: 1;
        min-width: 0;
      }
      .card-city {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.2;
      }
      .card-country {
        font-size: 10px;
        color: var(--muted);
        margin-top: 1px;
      }

      /* Time col */
      .card-time-col {
        text-align: right;
        flex-shrink: 0;
      }
      .card-time {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 1px;
        line-height: 1;
        color: var(--text);
      }
      .card-ampm {
        font-size: 11px;
        font-weight: 500;
        opacity: 0.5;
        margin-left: 2px;
      }
      .card-meta {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 3px;
      }
      .card-offset {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--blue);
        opacity: 0.85;
      }
      .card-date {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--muted);
        opacity: 0.85;
      }
      .card-day {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.5px;
        padding: 1px 6px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
      }
      .card-day.tmr {
        background: rgba(118, 228, 247, 0.08);
        color: var(--cyan);
      }
      .card-day.ysd {
        background: rgba(183, 148, 244, 0.08);
        color: var(--violet);
      }

      /* Remove btn */
      .remove-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: rgba(246, 135, 179, 0.1);
        border: 1px solid rgba(246, 135, 179, 0.2);
        color: var(--pink);
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.15s,
          background 0.15s;
        z-index: 5;
      }
      .remove-btn:hover {
        background: rgba(246, 135, 179, 0.22);
      }

      /* ── Add button ── */
      .add-btn {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.01);
        backdrop-filter: blur(12px);
        border: 1px dashed rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
        font-family: "Outfit", sans-serif;
        transition:
          border-color 0.2s,
          background 0.2s,
          color 0.2s;
      }
      .add-btn:hover {
        border-color: var(--blue);
        background: rgba(99, 179, 237, 0.05);
        color: var(--blue);
      }
      .add-plus {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: rgba(99, 179, 237, 0.1);
        border: 1px solid rgba(99, 179, 237, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: var(--blue);
        transition:
          transform 0.25s,
          background 0.2s;
      }
      .add-btn:hover .add-plus {
        transform: rotate(90deg);
        background: rgba(99, 179, 237, 0.18);
      }

      /* ════════════════════════════════════════
       MODAL
    ════════════════════════════════════════ */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(6, 8, 15, 0.88);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s;
      }
      .overlay.open {
        opacity: 1;
        pointer-events: all;
      }

      .modal {
        background: rgba(10, 13, 22, 0.75);
        backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 22px 20px;
        width: 360px;
        max-width: 92vw;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transform: translateY(18px) scale(0.96);
        transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow:
          0 40px 100px rgba(0, 0, 0, 0.7),
          inset 0 1px 1px rgba(255, 255, 255, 0.1),
          0 0 0 1px rgba(99, 179, 237, 0.07);
      }
      .overlay.open .modal {
        transform: none;
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-title {
        font-size: 15px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--blue), var(--cyan));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .modal-close-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .modal-close-btn:hover {
        background: rgba(246, 135, 179, 0.1);
        color: var(--pink);
      }

      /* Search */
      .search-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .search-ico {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
        display: flex;
      }
      .search-input {
        width: 100%;
        padding: 9px 10px 9px 34px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-family: "Outfit", sans-serif;
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-input::placeholder {
        color: rgba(180, 195, 240, 0.35);
      }
      .search-input:focus {
        border-color: rgba(99, 179, 237, 0.4);
      }

      /* Zone list */
      .tz-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 5px;
        scrollbar-width: thin;
        scrollbar-color: rgba(99, 179, 237, 0.2) transparent;
        min-height: 0;
        max-height: 240px;
      }
      .tz-opt {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        cursor: pointer;
        transition:
          background 0.14s,
          border-color 0.14s,
          transform 0.14s;
      }
      .tz-opt:hover {
        background: rgba(99, 179, 237, 0.07);
        border-color: rgba(99, 179, 237, 0.3);
        transform: translateX(2px);
      }
      .tz-opt-flag {
        font-size: 18px;
        flex-shrink: 0;
      }
      .tz-opt-info {
        flex: 1;
        min-width: 0;
      }
      .tz-opt-name {
        font-size: 13px;
        font-weight: 500;
      }
      .tz-opt-tz {
        font-size: 10px;
        color: var(--muted);
        margin-top: 1px;
      }
      .tz-opt-off {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--blue);
        flex-shrink: 0;
      }
      .tz-empty {
        text-align: center;
        color: var(--muted);
        padding: 20px 10px;
        font-size: 12px;
        line-height: 1.6;
      }

      /* Custom TZ */
      .custom-section {
        flex-shrink: 0;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .custom-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .custom-row {
        display: flex;
        gap: 6px;
      }
      .custom-input {
        flex: 1;
        padding: 8px 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 9px;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        outline: none;
        transition: border-color 0.2s;
      }
      .custom-input::placeholder {
        color: rgba(180, 195, 240, 0.28);
        font-family: "Outfit", sans-serif;
      }
      .custom-input:focus {
        border-color: rgba(99, 179, 237, 0.4);
      }
      .custom-input.err {
        border-color: rgba(246, 135, 179, 0.6);
        animation: shake 0.3s;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }
      .custom-add {
        padding: 8px 14px;
        background: linear-gradient(135deg, var(--blue), var(--cyan));
        border: none;
        border-radius: 9px;
        color: #06080f;
        font-family: "Outfit", sans-serif;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition:
          opacity 0.15s,
          transform 0.15s;
      }
      .custom-add:hover {
        opacity: 0.85;
      }
      .custom-add:active {
        transform: scale(0.96);
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        background: rgba(104, 211, 145, 0.12);
        border: 1px solid rgba(104, 211, 145, 0.35);
        color: var(--green);
        padding: 7px 16px;
        border-radius: 30px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        pointer-events: none;
        z-index: 200;
        transition:
          opacity 0.2s,
          transform 0.2s;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ── Custom Titlebar ── -->
      <div class="titlebar">
        <div class="titlebar-title">
          <span class="titlebar-icon"><img class="logo-img" src="{{LOGO_SVG_BASE64}}" alt="Logo" /></span>
          <span class="titlebar-name">Zlock</span>
        </div>
        <div class="win-controls">
          <button class="win-btn min" id="btnMin" title="Minimize"></button>
          <button class="win-btn max" id="btnMax" title="Maximize"></button>
          <button class="win-btn close" id="btnClose" title="Close"></button>
        </div>
      </div>

      <!-- ── Zone cards ── -->
      <div class="zones-wrap" id="zonesWrap">
        <!-- cards injected here -->
        <button class="add-btn" id="addBtn">
          <div class="add-plus">+</div>
          Add time zone
        </button>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Modal -->
    <div class="overlay" id="overlay" role="dialog" aria-modal="true">
      <div class="modal">
        <div class="modal-head">
          <span class="modal-title">Add Time Zone</span>
          <button class="modal-close-btn" id="modalClose">✕</button>
        </div>
        <div class="search-wrap">
          <span class="search-ico">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </span>
          <input
            class="search-input"
            id="tzSearch"
            type="search"
            placeholder="Search city or region…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="tz-list" id="tzList"></div>
        <div class="custom-section">
          <div class="custom-label">Custom IANA Timezone</div>
          <div class="custom-row">
            <input
              class="custom-input"
              id="customInput"
              type="text"
              placeholder="e.g. Asia/Kuala_Lumpur"
              spellcheck="false"
            />
            <button class="custom-add" id="customAdd">Add</button>
          </div>
        </div>
      </div>
    </div>

          a: "#68d391",
          b: "#276749",
        },
        {
          city: "Moscow",
          country: "Russia",
          flag: "🏛️",
          tz: "Europe/Moscow",
          a: "#fc8181",
          b: "#e53e3e",
        },
        {
          city: "Berlin",
          country: "Germany",
          flag: "🍺",
          tz: "Europe/Berlin",
          a: "#f6ad55",
          b: "#dd6b20",
        },
        {
          city: "Seoul",
          country: "South Korea",
          flag: "🎎",
          tz: "Asia/Seoul",
          a: "#b794f4",
          b: "#805ad5",
        },
        {
          city: "Bangkok",
          country: "Thailand",
          flag: "🐘",
          tz: "Asia/Bangkok",
          a: "#f6ad55",
          b: "#c05621",
        },
        {
          city: "Jakarta",
          country: "Indonesia",
          flag: "🌴",
          tz: "Asia/Jakarta",
          a: "#68d391",
          b: "#276749",
        },
        {
          city: "Auckland",
          country: "New Zealand",
          flag: "🥝",
          tz: "Pacific/Auckland",
          a: "#63b3ed",
          b: "#2b6cb0",
        },
        {
          city: "Honolulu",
          country: "Hawaii",
          flag: "🌺",
          tz: "Pacific/Honolulu",
          a: "#f687b3",
          b: "#97266d",
        },
        {
          city: "Mexico City",
          country: "Mexico",
          flag: "🌵",
          tz: "America/Mexico_City",
          a: "#68d391",
          b: "#276749",
        },
        {
          city: "Buenos Aires",
          country: "Argentina",
          flag: "🥩",
          tz: "America/Argentina/Buenos_Aires",
          a: "#63b3ed",
          b: "#2c5282",
        },
        {
          city: "Riyadh",
          country: "Saudi Arabia",
          flag: "🕌",
          tz: "Asia/Riyadh",
          a: "#f6ad55",
          b: "#744210",
        },
        {
          city: "Kuala Lumpur",
          country: "Malaysia",
          flag: "🇲🇾",
          tz: "Asia/Kuala_Lumpur",
          a: "#68d391",
          b: "#276749",
        },
        {
          city: "Taipei",
          country: "Taiwan",
          flag: "🇹🇼",
          tz: "Asia/Taipei",
          a: "#76e4f7",
          b: "#0bc5ea",
        },
        {
          city: "Manila",
          country: "Philippines",
          flag: "🇵🇭",
          tz: "Asia/Manila",
          a: "#f6ad55",
          b: "#c05621",
        },
      ];
      const DEFAULT_TZ = [
        "Asia/Manila",
        "America/Chicago",
      ];

      // ══════════════════════════════════════════════════
      // STATE — clears saved data if defaults change
      // ══════════════════════════════════════════════════
      let _mem = null;
      const load = () => {
        try {
          return JSON.parse(localStorage.getItem("zlock") || "null");
        } catch {
          return _mem;
        }
      };
      const save = () => {
        try {
          localStorage.setItem("zlock", JSON.stringify(active));
        } catch {
          _mem = active.slice();
        }
      };
      // Reset saved zones if the defaults version changed (v4 = Manila+Chicago defaults)
      try {
        if (localStorage.getItem("zlock-v") !== "4") {
          localStorage.removeItem("zlock");
          localStorage.setItem("zlock-v", "4");
        }
      } catch {}
      let active =
        load() || DEFAULT_TZ.map((tz) => ZONES.find((z) => z.tz === tz));

      // ══════════════════════════════════════════════════
      // HELPERS
      // ══════════════════════════════════════════════════
      const pad = (n) => String(n).padStart(2, "0");
      const zDate = (tz) =>
        new Date(new Date().toLocaleString("en-US", { timeZone: tz }));
      const fmt = (d) => {
        let h = d.getHours(),
          m = d.getMinutes();
        const ap = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return { hm: `${pad(h)}:${pad(m)}`, ap };
      };
      const offset = (tz) => {
        const diff = (zDate(tz) - new Date()) / 3600000;
        const s = diff >= 0 ? "+" : "−";
        const h = Math.floor(Math.abs(diff));
        const m = Math.round((Math.abs(diff) - h) * 60);
        return `UTC${s}${pad(h)}:${pad(m)}`;
      };
      const dayRel = (tz) => {
        const there = zDate(tz),
          here = new Date();
        const d = there.getDate() - here.getDate();
        if (d === 1 || d < -20) return "tmr";
        if (d === -1 || d > 20) return "ysd";
        return "";
      };

      // ══════════════════════════════════════════════════
      // RENDER CARDS
      // ══════════════════════════════════════════════════
      const wrap = document.getElementById("zonesWrap");
      const addBtn = document.getElementById("addBtn");

      function renderCards() {
        // Remove old cards (keep addBtn)
        wrap.querySelectorAll(".clock-card").forEach((el) => el.remove());

        active.forEach((z, i) => {
          const rel = dayRel(z.tz);
          const card = document.createElement("div");
          card.className = "clock-card";
          card.style.setProperty("--ca", z.a);
          card.style.setProperty("--cb", z.b);
          card.dataset.i = i;
          card.innerHTML = `
        <button class="remove-btn" data-i="${i}" title="Remove">×</button>
        <div class="card-flag">${z.flag}</div>
        <div class="card-info">
          <div class="card-city">${z.city}</div>
          <div class="card-country">${z.country}</div>
        </div>
        <div class="card-time-col">
          <div class="card-time" data-t="${i}">
            <span class="hm">--:--</span><span class="card-ampm">--</span>
          </div>
          <div class="card-meta">
            <span class="card-date" data-d="${i}">—</span>
            <span class="card-offset">${offset(z.tz)}</span>
            ${rel ? `<span class="card-day ${rel}">${rel === "tmr" ? "tomorrow" : "yesterday"}</span>` : ""}
          </div>
        </div>
      `;
          wrap.insertBefore(card, addBtn);
        });

        wrap.querySelectorAll(".remove-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            active.splice(+btn.dataset.i, 1);
            save();
            renderCards();
            fillModal();
          });
        });
      }

      // ══════════════════════════════════════════════════
      // TICK
      // ══════════════════════════════════════════════════
      function tick() {
        const now = new Date();
        // Cards only
        active.forEach((z, i) => {
          const el = document.querySelector(`[data-t="${i}"]`);
          if (!el) return;
          const targetDate = zDate(z.tz);
          const { hm, ap } = fmt(targetDate);
          el.querySelector(".hm").textContent = hm;
          el.querySelector(".card-ampm").textContent = ap;

          // Update card date (e.g. Aug 29)
          const dateEl = document.querySelector(`[data-d="${i}"]`);
          if (dateEl) {
            dateEl.textContent = targetDate.toLocaleDateString("en-US", { month: "short", day: "numeric" });
          }
        });
      }



      // ══════════════════════════════════════════════════
      // TOAST
      // ══════════════════════════════════════════════════
      let _tt = null;
      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        if (_tt) clearTimeout(_tt);
        _tt = setTimeout(() => el.classList.remove("show"), 2000);
      }

      // ══════════════════════════════════════════════════
      // MODAL
      // ══════════════════════════════════════════════════
      const overlay = document.getElementById("overlay");
      const tzList = document.getElementById("tzList");
      const search = document.getElementById("tzSearch");
      let query = "";

      function available() {
        const set = new Set(active.map((z) => z.tz));
        const q = query.toLowerCase().trim();
        return ZONES.filter(
          (z) =>
            !set.has(z.tz) &&
            (!q ||
              z.city.toLowerCase().includes(q) ||
              z.country.toLowerCase().includes(q) ||
              z.tz.toLowerCase().includes(q)),
        );
      }

      function addZone(z) {
        active.push(z);
        save();
        renderCards();
        toast(`✓ ${z.city} added`);
        fillModal();
      }

      function fillModal() {
        tzList.innerHTML = "";
        const list = available();
        if (!list.length) {
          tzList.innerHTML = `<div class="tz-empty">${
            query
              ? `No results for "<strong>${query}</strong>"`
              : "All zones added!"
          }</div>`;
          return;
        }
        list.forEach((z) => {
          const d = document.createElement("div");
          d.className = "tz-opt";
          d.tabIndex = 0;
          d.setAttribute("role", "button");
          d.innerHTML = `
        <span class="tz-opt-flag">${z.flag}</span>
        <div class="tz-opt-info">
          <div class="tz-opt-name">${z.city}, ${z.country}</div>
          <div class="tz-opt-tz">${z.tz.replace(/_/g, " ")}</div>
        </div>
        <span class="tz-opt-off">${offset(z.tz)}</span>
      `;
          const go = () => addZone(z);
          d.addEventListener("click", go);
          d.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              go();
            }
          });
          tzList.appendChild(d);
        });
      }

      function openModal() {
        query = "";
        search.value = "";
        document.getElementById("customInput").value = "";
        fillModal();
        overlay.classList.add("open");
        setTimeout(() => search.focus(), 60);
      }
      function closeModal() {
        overlay.classList.remove("open");
      }

      search.addEventListener("input", () => {
        query = search.value;
        fillModal();
      });
      document
        .getElementById("modalClose")
        .addEventListener("click", closeModal);
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // Custom TZ
      function tryCustom() {
        const inp = document.getElementById("customInput");
        const raw = inp.value.trim();
        if (!raw) return;
        try {
          new Intl.DateTimeFormat("en-US", { timeZone: raw }).format(
            new Date(),
          );
        } catch {
          inp.classList.add("err");
          setTimeout(() => inp.classList.remove("err"), 500);
          toast("⚠ Invalid timezone");
          return;
        }
        if (active.some((z) => z.tz === raw)) {
          toast("Already added");
          closeModal();
          return;
        }
        const parts = raw.split("/");
        const c = [
          "#63b3ed",
          "#68d391",
          "#f687b3",
          "#f6ad55",
          "#b794f4",
          "#76e4f7",
        ][active.length % 6];
        addZone({
          city: parts[parts.length - 1].replace(/_/g, " "),
          country: parts[0] || "Custom",
          flag: "🌐",
          tz: raw,
          a: c,
          b: c,
        });
        inp.value = "";
        closeModal();
      }
      document.getElementById("customAdd").addEventListener("click", tryCustom);
      document
        .getElementById("customInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") tryCustom();
        });

      addBtn.addEventListener("click", openModal);

      document.getElementById("btnClose").addEventListener("click", () => {
        if (typeof __closeWindow !== "undefined") {
          // deno-lint-ignore no-undef
          __closeWindow();
        } else {
          window.close();
        }
      });
      document.getElementById("btnMin").addEventListener("click", () => {
        if (typeof __minimize !== "undefined") {
          // deno-lint-ignore no-undef
          __minimize();
        }
      });
      document.getElementById("btnMax").addEventListener("click", () => {
        if (typeof __maximize !== "undefined") {
          // deno-lint-ignore no-undef
          __maximize();
        }
      });

      // ══════════════════════════════════════════════════
      // NATIVE DRAG  (WM_NCLBUTTONDOWN / HTCAPTION via Deno FFI)
      // ══════════════════════════════════════════════════
      document.querySelector(".titlebar").addEventListener("mousedown", (e) => {
        // Only trigger on left-click, and not on the win-control buttons
        if (e.button === 0 && !e.target.closest(".win-controls")) {
          e.preventDefault();
          if (typeof __startDrag !== "undefined") {
            // deno-lint-ignore no-undef
            __startDrag();
          }
        }
      });

      // ══════════════════════════════════════════════════
      // INIT
      // ══════════════════════════════════════════════════
      renderCards();
      tick();
      setInterval(tick, 1000);

      // Remove the OS title bar (calls Deno FFI bound in main.ts)
      window.addEventListener("load", () => {
        if (typeof __removeFrame !== "undefined") {
          // deno-lint-ignore no-undef
          __removeFrame();
        }
      });
    </script>
  </body>
